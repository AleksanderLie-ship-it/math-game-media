<!doctype html>
<meta charset="utf-8">
<title>relay</title>
<body>relay: starting
<script>
(async () => {
  const say = t => { document.body.textContent = 'relay: ' + t; };
  const ALLOWED = 'https://raw.githubusercontent.com/AleksanderLie-ship-it/math-game-media/main/';
  const TARGET = 'https://www.instagram.com';
  const p = new URLSearchParams(location.hash.slice(1));
  const names = (p.get('f') || '').split(',').filter(Boolean);
  const dir = p.get('d') || '';
  if (!window.opener) { say('no opener'); return; }
  if (!/^r121-[0-9a-f]{12}$/.test(dir)) { say('bad folder'); return; }
  try {
    for (const n of names) {
      if (!/^[a-z_]+\.(mp4|jpg)$/.test(n)) { say('bad name'); return; }
      say('fetching ' + n);
      const r = await fetch(ALLOWED + dir + '/' + n, { cache: 'no-store' });
      const b = await r.arrayBuffer();
      window.opener.postMessage({ mp: 1, name: n, status: r.status, buf: b }, TARGET, [b]);
    }
    say('sent ' + names.join(', '));
  } catch (e) {
    say('error ' + e);
    try { window.opener.postMessage({ mp: 1, error: String(e) }, TARGET); } catch (_) {}
  }
})();
</script>
